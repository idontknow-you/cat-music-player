<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cat Music Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="min-h-screen">
  <!-- Icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5v14M19 5 9 12l10 7z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M18 5v14M5 5l10 7-10 7z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <div id="sky" aria-hidden="true">
    <div id="stars"></div>
    <div class="moon"></div>
    <div id="bokeh"></div>
    <svg id="city"></svg>
  </div>
  <div class="frame" aria-hidden="true"></div>

  <main class="max-w-md mx-auto px-5 pt-8 pb-10 text-center">
    <section class="stage">
      <div id="cat" class="cat sleeping">
        <div class="sprite" role="img" aria-label="Pixel-art calico cat"></div>
      </div>
      <div class="sill"></div>
    </section>

    <section class="panel">
      <div id="nameTag" class="name-tag">Loading...</div>

      <div class="flex items-center gap-3 mt-5">
        <span id="cur" class="time">0:00</span>
        <input id="seek" type="range" min="0" max="100" value="0" class="flex-1" aria-label="Seek">
        <span id="dur" class="time">0:00</span>
      </div>

      <div class="flex justify-center items-center gap-4 mt-5">
        <button id="shuffle" class="ctl" aria-label="Shuffle"><svg><use href="#i-shuffle"/></svg></button>
        <button id="prev" class="ctl" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
        <button id="play" class="ctl big" aria-label="Play">
          <svg class="ic-play"><use href="#i-play"/></svg>
          <svg class="ic-pause" style="display:none"><use href="#i-pause"/></svg>
        </button>
        <button id="next" class="ctl" aria-label="Next"><svg><use href="#i-next"/></svg></button>
        <button id="repeat" class="ctl" aria-label="Repeat"><svg><use href="#i-repeat"/></svg></button>
      </div>

      <div class="flex items-center justify-center gap-3 mt-5">
        <span class="time">vol</span>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" class="w-40" aria-label="Volume">
      </div>

      <ol id="playlist" class="mt-6 text-left"></ol>

      <form id="request" class="request" autocomplete="off">
        <h2>Request a song</h2>
        <input id="rq-song" required maxlength="80" placeholder="Song title">
        <input id="rq-artist" maxlength="80" placeholder="Artist">
        <button class="ctl wide" type="submit">Send request</button>
        <p id="rq-msg" role="status"></p>
      </form>
    </section>
  </main>
  <script src="/scene.js"></script>
  <script src="/player.js"></script>
  <script type="module" src="/request.js"></script>
</body>
</html>
